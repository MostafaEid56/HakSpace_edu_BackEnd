version: '3.8'

services:
  postgres_dev:
    image: postgres:15-alpine
    container_name: hakspace_postgres_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hakspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_dev_data:
