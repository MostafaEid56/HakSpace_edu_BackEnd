events {
    worker_connections 1024;
}

http {
    # Hide nginx version for security
    server_tokens off;

    # Handle client request size (e.g., for file uploads)
    client_max_body_size 20M;

    # HTTP Server - redirects all traffic to HTTPS
    server {
        listen 80;
        server_name api.haksc.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name api.haksc.com;

        # SSL Certificates (mounted from VPS host /etc/letsencrypt)
        ssl_certificate /etc/letsencrypt/live/api.haksc.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.haksc.com/privkey.pem;

        # Modern SSL configuration recommendations
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        location / {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS Pre-flight & headers configuration if needed (already handled by Spring Boot, but proxy headers ensure correct schemes)
        }
    }
}
